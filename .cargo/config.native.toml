[alias]
dev = "run --package uv-dev --features dev"

# Use Chinese mirror for crates.io
[source.crates-io]
replace-with = 'ustc'

[source.ustc]
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"

# OHOS (OpenHarmony) native compilation on device
[target.aarch64-unknown-linux-ohos]
linker = "/data/service/hnp/bin/clang"
ar = "/data/service/hnp/bin/llvm-ar"
rustflags = ["-C", "link-arg=--target=aarch64-linux-ohos", "-C", "link-arg=--sysroot=/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot"]

[env]
OHOS_SYSROOT = "/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot"
CC_aarch64_unknown_linux_ohos = "/data/service/hnp/bin/clang"
CFLAGS_aarch64_unknown_linux_ohos = "--target=aarch64-linux-ohos --sysroot=/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot -D__MUSL__"
CXX_aarch64_unknown_linux_ohos = "/data/service/hnp/bin/clang++"
CXXFLAGS_aarch64_unknown_linux_ohos = "--target=aarch64-linux-ohos --sysroot=/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot -D__MUSL__"
AR_aarch64_unknown_linux_ohos = "/data/service/hnp/bin/llvm-ar"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER = "/data/service/hnp/bin/clang"
CMAKE_aarch64_unknown_linux_ohos = "/data/service/hnp/bin/cmake"
CMAKE_GENERATOR_aarch64_unknown_linux_ohos = "Ninja"
CMAKE_MAKE_PROGRAM_aarch64_unknown_linux_ohos = "/data/service/hnp/bin/ninja"
CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_ohos = { value = "ohos-native-toolchain.cmake", relative = true }
PATH = { value = "/data/service/hnp/bin", prepend = true }
