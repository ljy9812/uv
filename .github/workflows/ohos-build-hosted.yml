# uv OHOS Build CI (GitHub-hosted)
#
# Cross-compile uv for HarmonyOS (OHOS) aarch64 on a GitHub-hosted Windows runner.
# The OHOS native SDK (LLVM + musl sysroot) is fetched from a GitHub Release asset
# (tag ohos-sdk-6.1.1.300), so no self-hosted runner or Huawei-account login is needed.
#
# Branch model:
#   main / ohdev / ohos-release — CI builds: verify cross-compile + ELF, upload artifact.
#
# Note: uses `cargo build` (debug) for per-commit compile+link verification, not release.

name: OHOS Build (GitHub-hosted)

on:
  push:
    branches:
      - main
      - ohdev
      - ohos-release
    paths:
      - 'crates/**/*.rs'
      - 'crates/**/*.py'
      - 'crates/**/*.json'
      - 'crates/**/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ohos-build-hosted.yml'
      - 'ohos-windows-toolchain.cmake'
  pull_request:
    branches:
      - main
      - ohdev
  workflow_dispatch:

concurrency:
  group: ohos-build-hosted-${{ github.ref }}
  cancel-in-progress: true

env:
  # SDK is downloaded per-run (cached) to this path.
  OHOS_SDK: C:\ohos-sdk
  OHOS_SDK_ZIP_URL: https://github.com/ljy9812/uv/releases/download/ohos-sdk-6.1.1.300/ohos-native.zip
  CARGO_INCREMENTAL: 1
  CARGO_BUILD_JOBS: 4

jobs:
  build:
    name: Build uv for OHOS (aarch64)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      # ============================================================
      # 1. Source checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. OHOS SDK (download + cache)
      # ============================================================
      - name: Cache OHOS SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.OHOS_SDK }}
          key: ohos-sdk-6.1.1.300-native

      - name: Download and extract OHOS SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $sdk = $env:OHOS_SDK
          $zip = "$env:RUNNER_TEMP\ohos-native.zip"
          Write-Host "=== Downloading OHOS SDK (877 MB) via curl ==="
          # Use curl.exe explicitly — in PowerShell, `curl` is an alias for
          # Invoke-WebRequest (which hung on this 877MB asset). curl.exe is the
          # real curl, preinstalled on GitHub-hosted Windows runners.
          # --fail errors on HTTP 4xx/5xx, --retry for transient failures,
          # --connect-timeout/--max-time avoid hanging, -L follows redirects.
          & curl.exe -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 1200 `
            -H "Authorization: Bearer $env:GITHUB_TOKEN" `
            -H "Accept: application/octet-stream" `
            -o $zip $env:OHOS_SDK_ZIP_URL
          if ($LASTEXITCODE -ne 0) { throw "curl download failed with exit code $LASTEXITCODE" }
          $sizeMB = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Downloaded: $sizeMB MB"
          Write-Host "=== Extracting ==="
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          Expand-Archive -Path $zip -DestinationPath $sdk -Force
          Write-Host "=== SDK extracted to $sdk ==="
          if (-not (Test-Path "$sdk\llvm\bin\clang.exe")) { throw "clang.exe not found after extract" }
          if (-not (Test-Path "$sdk\sysroot")) { throw "sysroot not found after extract" }
          Write-Host "OK clang.exe + sysroot present"

      - name: Verify OHOS SDK
        shell: powershell
        run: |
          $sdk = $env:OHOS_SDK
          if (-not (Test-Path "$sdk\llvm\bin\clang.exe")) { throw "clang.exe not found at $sdk\llvm\bin\" }
          if (-not (Test-Path "$sdk\sysroot")) { throw "sysroot not found at $sdk\sysroot" }
          Write-Host "OK OHOS SDK: $sdk"

      # ============================================================
      # 3. Rust + OHOS target
      # ============================================================
      - name: Install Rust OHOS target
        shell: powershell
        run: |
          rustup target add aarch64-unknown-linux-ohos
          $targets = rustc --print target-list
          if ($targets -notcontains "aarch64-unknown-linux-ohos") {
            throw "aarch64-unknown-linux-ohos target not supported by rustc"
          }
          Write-Host "OK Rust target: aarch64-unknown-linux-ohos"
          rustc --version
          cargo --version

      # ============================================================
      # 4. Setup cross-compilation environment
      # ============================================================
      - name: Setup OHOS cross-compilation environment
        shell: powershell
        run: |
          $sdk = $env:OHOS_SDK -replace '\\','/'
          $sysroot = "$sdk/sysroot"
          $llvm = "$sdk/llvm/bin"
          $target = "aarch64-linux-ohos"

          # Set env vars (override any .cargo/config.toml device paths)
          "OHOS_SYSROOT=$sysroot" >> $env:GITHUB_ENV
          "CC_aarch64_unknown_linux_ohos=$llvm/clang.exe" >> $env:GITHUB_ENV
          "CFLAGS_aarch64_unknown_linux_ohos=--target=$target --sysroot=$sysroot -D__MUSL__" >> $env:GITHUB_ENV
          "CXX_aarch64_unknown_linux_ohos=$llvm/clang++.exe" >> $env:GITHUB_ENV
          "CXXFLAGS_aarch64_unknown_linux_ohos=--target=$target --sysroot=$sysroot -D__MUSL__" >> $env:GITHUB_ENV
          "AR_aarch64_unknown_linux_ohos=$llvm/llvm-ar.exe" >> $env:GITHUB_ENV
          "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=$llvm/clang.exe" >> $env:GITHUB_ENV
          "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_RUSTFLAGS=-C link-arg=--target=$target -C link-arg=--sysroot=$sysroot" >> $env:GITHUB_ENV
          "AWS_LC_SYS_CMAKE_AR=$llvm/llvm-ar.exe" >> $env:GITHUB_ENV
          "AWS_LC_SYS_CMAKE_RANLIB=$llvm/llvm-ranlib.exe" >> $env:GITHUB_ENV

          # Windows-compatible cmake toolchain (referenced by aws-lc-rs etc.)
          "CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_ohos=$env:GITHUB_WORKSPACE\ohos-windows-toolchain.cmake" >> $env:GITHUB_ENV

          # CMake generator: Ninja. GitHub-hosted Windows has cmake+ninja preinstalled;
          # fall back to SDK's bundled cmake/ninja if needed.
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          $sdkNinja = "$env:OHOS_SDK\build-tools\cmake\bin\ninja.exe"
          if (Test-Path $sdkNinja) {
            "CMAKE_MAKE_PROGRAM=$sdkNinja" >> $env:GITHUB_ENV
            "$env:OHOS_SDK\build-tools\cmake\bin" >> $env:GITHUB_PATH
          } else {
            $runnerNinja = (Get-Command ninja.exe -ErrorAction SilentlyContinue).Source
            if ($runnerNinja) { "CMAKE_MAKE_PROGRAM=$runnerNinja" >> $env:GITHUB_ENV }
          }

          Write-Host "OK Environment configured"
          Write-Host "   Sysroot: $sysroot"
          Write-Host "   LLVM:    $llvm"

      # ============================================================
      # 5. Caching (cargo registry + target)
      # ============================================================
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ohos-hosted-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ohos-hosted-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ohos-hosted-cargo-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ohos-hosted-cargo-target-

      # ============================================================
      # 6. Build (debug, for per-commit compile+link verification)
      # ============================================================
      - name: Build uv
        shell: powershell
        run: |
          # If a device-native .cargo/config.toml exists, move it aside: its
          # [target.aarch64-unknown-linux-ohos] rustflags carry OHOS device paths that
          # would merge with (not replace) the CI env vars set above.
          $configPath = Join-Path (Join-Path $env:GITHUB_WORKSPACE ".cargo") "config.toml"
          $configBak  = Join-Path (Join-Path $env:GITHUB_WORKSPACE ".cargo") "config.toml.ci-bak"
          if (Test-Path $configPath) {
            Move-Item -Force $configPath $configBak
            Write-Host "Moved config.toml aside to avoid device path conflicts"
          }
          try {
            & cargo build --target aarch64-unknown-linux-ohos -p uv
            if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }
          } finally {
            if (Test-Path $configBak) {
              Move-Item -Force $configBak $configPath
              Write-Host "Restored config.toml"
            }
          }

      # ============================================================
      # 7. Verify binary (ELF is AArch64 OHOS, musl-linked)
      # ============================================================
      - name: Verify binary
        shell: powershell
        run: |
          $bin = "target/aarch64-unknown-linux-ohos/debug/uv"
          $readelf = "$env:OHOS_SDK\llvm\bin\llvm-readelf.exe"

          Write-Host "=== File info ==="
          Get-Item $bin | Select-Object Name, Length, LastWriteTime | Format-List

          Write-Host "=== ELF header ==="
          $header = & $readelf -h $bin 2>&1
          $header | Select-String "Class|Machine|OS/ABI"
          if (-not ($header | Select-String "AArch64")) { throw "Not an AArch64 ELF binary" }
          Write-Host "OK Valid AArch64 ELF"

          Write-Host ""
          Write-Host "=== Dynamic dependencies ==="
          $dynamic = & $readelf -d $bin 2>&1
          $needed = $dynamic | Select-String "NEEDED" | ForEach-Object { $_ -replace '.*\[(.*)\].*','$1' }
          Write-Host "NEEDED: $needed"
          foreach ($lib in $needed) {
            if ($lib -eq "libc.so") {
              Write-Host "OK Expected: $lib"
            } else {
              $dynamic | Select-String "NEEDED"
              throw "Unexpected dynamic dependency: $lib"
            }
          }
          Write-Host "OK Binary validation passed"

      # ============================================================
      # 8. Upload artifact (raw binary, 30-day retention)
      # ============================================================
      - name: Upload artifact (raw binary)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: uv-ohos-aarch64-hosted-${{ github.sha }}
          path: target/aarch64-unknown-linux-ohos/debug/uv
          retention-days: 30
